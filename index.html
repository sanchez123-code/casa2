<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Planes y Precios</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
</head>
<body class="bg-dark text-white p-4">

    <div class="container py-5">
        <h2 class="text-center mb-5 fw-bold">Elige tu Plan</h2>
        <div class="row g-4 text-center">
            <div class="col-12 col-md-4">
                <div class="card bg-light text-dark h-100 shadow">
                    <div class="card-header bg-transparent border-0 pt-4">
                        <h3 class="fw-bold">Básico</h3>
                    </div>
                    <div class="card-body d-flex flex-column justify-content-between">
                        <div class="my-3">
                            <span class="display-4 fw-bold">$19</span>
                            <span class="text-muted">/mes</span>
                        </div>
                        <button class="btn btn-outline-dark fw-bold w-100 mt-3">Elegir</button>
                    </div>
                </div>
            </div>
            <div class="col-12 col-md-4">
                <div class="card bg-primary text-white h-100 shadow-lg border-2 border-warning">
                    <div class="card-header bg-transparent border-0 pt-4">
                        <h3 class="fw-bold">Pro VIP</h3>
                    </div>
                    <div class="card-body d-flex flex-column justify-content-between">
                        <div class="my-3">
                            <span class="display-4 fw-bold">$49</span>
                            <span>/mes</span>
                        </div>
                        <button class="btn btn-warning fw-bold text-dark w-100 mt-3">Elegir</button>
                    </div>
                </div>
            </div>
            <div class="col-12 col-md-4">
                <div class="card bg-dark text-white border-secondary h-100 shadow">
                    <div class="card-header bg-transparent border-0 pt-4">
                        <h3 class="fw-bold">Enterprise</h3>
                    </div>
                    <div class="card-body d-flex flex-column justify-content-between">
                        <div class="my-3">
                            <span class="display-4 fw-bold">$99</span>
                            <span class="text-light-50">/mes</span>
                        </div>
                        <button class="btn btn-outline-light fw-bold w-100 mt-3">Elegir</button>
                    </div>
                </div>
            </div>

        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
</body>
</html>
